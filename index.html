<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PlateLog">
<meta name="theme-color" content="#14202b">
<link rel="manifest" href="manifest.webmanifest">
<title>PlateLog</title>
<style>
:root{--bg:#14202b;--panel:#1d2d3b;--ink:#e9eef2;--mute:#8da0b0;--plate:#f2c230;--bad:#ff6b5e;--ok:#5ed39a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,Roboto,sans-serif}
main{max-width:560px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:22px 0 8px}
.cam{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;display:block}
.guide{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:absolute;border:2px solid var(--plate);border-radius:6px;touch-action:none;cursor:move}.guide .h{position:absolute;right:-2px;bottom:-2px;width:48px;height:48px;background:var(--plate);border-radius:6px 0 6px 0;touch-action:none}
.cam p{pointer-events:none;position:absolute;inset:0;display:grid;place-items:center;margin:0;color:var(--mute);text-align:center;padding:20px}
button,select{font:inherit;border-radius:8px;border:0;padding:12px 14px;background:var(--panel);color:var(--ink)}
button.go{background:var(--plate);color:#111;font-weight:700}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
#plate{width:100%;font:700 34px/1.1 'Arial Narrow','Helvetica Neue',Arial,sans-serif;letter-spacing:3px;text-align:center;text-transform:uppercase;background:var(--plate);color:#111;border:3px solid #111;outline:2px solid var(--plate);border-radius:8px;padding:10px;margin-top:12px}
#plate::placeholder{color:#8a6f10}
.msg{border-radius:8px;padding:12px;margin-top:10px;background:var(--panel)}
.msg.hit{border-left:5px solid var(--bad)}.msg.maybe{border-left:5px solid var(--plate)}.msg.new{border-left:5px solid var(--ok)}
.msg b{font-size:18px}.mute{color:var(--mute);font-size:14px}
details{background:var(--panel);border-radius:8px;margin-bottom:6px;padding:10px 12px}
summary{cursor:pointer;display:flex;justify-content:space-between;font-weight:600}
.msg.today{border-left:5px solid #6aa9ff}.md{color:var(--bad);font-weight:600}.bd{color:#6aa9ff;font-weight:600}.dh{margin-top:8px}
.s{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #2c4052;font-size:14px}
.s button{padding:2px 8px;background:none;color:var(--bad)}
.set{display:flex;gap:8px;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<main>
<h1>PlateLog <small class="mute">v8</small></h1>
<div class="cam"><video id="v" playsinline muted></video><div class="guide"><span class="h"></span></div><p id="ph">Camera is off</p></div>
<div class="row"><button id="cam">Start camera</button><button id="scan" class="go" disabled>Read plate</button><button id="auto" disabled>Auto: off</button></div>
<div class="row"><button id="mode">Search: yellow box</button><button id="rbox">Reset box</button></div>
<p class="mute" id="st">Reader not loaded yet.</p>
<input id="plate" placeholder="AB12 CDE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Number plate">
<div class="row"><button id="log" class="go">Log sighting</button></div>
<div id="res"></div>
<h2>History</h2>
<div class="row"><button id="multi">Show: all plates</button></div>
<div id="hist"></div>
<h2>Settings</h2>
<div class="set"><label for="ret">Delete sightings older than</label>
<select id="ret"><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option><option value="365">1 year</option><option value="0">Never</option></select></div>
<div class="row"><button id="wipe">Delete all sightings</button></div>
</main>
<canvas id="c" hidden></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
const $=s=>document.querySelector(s), KEY='platelog.v1', SET='platelog.days';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=a=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){alert('Could not save: storage is full or blocked.')}};
let days=+(localStorage.getItem(SET)||90);
function purge(){if(!days)return;const c=Date.now()-days*864e5;save(load().filter(r=>r.t>c))}

// UK plate formats: current, prefix, suffix, dateless/Northern Ireland
const PATS=[/^[A-Z]{2}\d{2}[A-Z]{3}$/,/^[A-Z]\d{1,3}[A-Z]{3}$/,/^[A-Z]{3}\d{1,3}[A-Z]$/,/^[A-Z]{1,3}\d{1,4}$/,/^\d{1,4}[A-Z]{1,3}$/];
const valid=s=>PATS.some(p=>p.test(s));
const L2D={O:'0',Q:'0',D:'0',I:'1',Z:'2',S:'5',G:'6',B:'8'},D2L={0:'O',1:'I',2:'Z',5:'S',6:'G',8:'B'};
function clean(raw){
  let s=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s.length===7&&!valid(s)){
    const f=[...s].map((c,i)=>(i===2||i===3)?(L2D[c]||c):(D2L[c]||c)).join('');
    if(valid(f))s=f;
  }
  return s;
}
const CONF={O:'0',Q:'0',D:'0',I:'1',L:'1',Z:'2',S:'5',G:'6',B:'8'};
const canon=s=>[...s].map(c=>CONF[c]||c).join('');
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length]}
const fmt=t=>new Date(t).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
const fmtT=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const day=t=>new Date(t).toLocaleDateString('en-CA'),pl=(n,w)=>n+' '+w+(n===1?'':'s');
const where=r=>r.lat==null?'location unavailable':r.lat.toFixed(4)+', '+r.lng.toFixed(4);

// Camera
let stream;
$('#cam').onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    $('#v').srcObject=stream;await $('#v').play();$('#ph').hidden=true;$('#cam').textContent='Camera on';
  }catch(e){$('#ph').textContent='Camera blocked. Allow camera access in browser settings, or type the plate in.'}
};

// Reader (Tesseract, runs on the device)
let worker;
async function initReader(){
  try{
    if(!window.Tesseract)throw 0;
    $('#st').textContent='Loading reader…';
    worker=await Tesseract.createWorker('eng');
    await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',tessedit_pageseg_mode:'7'});
    localStorage.setItem('platelog.ready','1');
    $('#st').textContent='Reader ready. Works offline on this device.';
    $('#scan').disabled=false;$('#auto').disabled=false;
  }catch(e){
    $('#st').textContent=localStorage.getItem('platelog.ready')?'Reader could not start. Type plates in manually.':'Reader needs one online load to download. You can still type plates in.';
  }
}
let box={x:.1,y:.37,w:.8,h:.26},curPsm='7',wide=localStorage.getItem('platelog.wide')==='1';
try{box=JSON.parse(localStorage.getItem('platelog.box'))||box}catch(e){}
function paintBox(){const g=$('.guide');g.style.left=box.x*100+'%';g.style.top=box.y*100+'%';g.style.width=box.w*100+'%';g.style.height=box.h*100+'%';g.hidden=wide}
function paintMode(){$('#mode').textContent='Search: '+(wide?'whole frame':'yellow box');$('#rbox').hidden=wide;paintBox()}
$('#mode').onclick=()=>{wide=!wide;localStorage.setItem('platelog.wide',wide?'1':'0');last='';paintMode()};
$('#rbox').onclick=()=>{box={x:.1,y:.37,w:.8,h:.26};localStorage.setItem('platelog.box',JSON.stringify(box));paintBox()};
(()=>{ // drag the box to move it, drag the corner to resize it
  const cam=$('.cam'),g=$('.guide');let m=null;
  g.addEventListener('pointerdown',e=>{m={r:e.target.classList.contains('h'),x:e.clientX,y:e.clientY,b:{...box}};g.setPointerCapture(e.pointerId);e.preventDefault()});
  g.addEventListener('pointermove',e=>{if(!m)return;const R=cam.getBoundingClientRect(),dx=(e.clientX-m.x)/R.width,dy=(e.clientY-m.y)/R.height;
    if(m.r){box.w=Math.min(1-box.x,Math.max(.2,m.b.w+dx));box.h=Math.min(1-box.y,Math.max(.1,m.b.h+dy))}
    else{box.x=Math.min(1-box.w,Math.max(0,m.b.x+dx));box.y=Math.min(1-box.h,Math.max(0,m.b.y+dy))}
    paintBox()});
  ['touchstart','touchmove'].forEach(t=>g.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  const end=()=>{if(m){m=null;localStorage.setItem('platelog.box',JSON.stringify(box))}};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
})();
// Whole-frame reading: look for plate-shaped text anywhere, also joining split words like "AB12" "CDE"
function pickWide(t){
  const out=[];
  t.split('\n').forEach(l=>{const w=l.split(/\s+/).filter(Boolean);
    for(let i=0;i<w.length;i++)for(let n=1;n<=3&&i+n<=w.length;n++){const c=clean(w.slice(i,i+n).join(''));if(c.length>=5&&valid(c))out.push(c)}});
  return out.sort((a,b)=>(PATS[0].test(b)-PATS[0].test(a))||b.length-a.length)[0]||'';
}
async function readFrame(){
  const v=$('#v');if(!v.videoWidth||!worker)return null;
  // work out which part of the video is on screen (the preview crops to fit), then map the box onto it
  const R=$('.cam').getBoundingClientRect(),f=Math.max(R.width/v.videoWidth,R.height/v.videoHeight),vw=R.width/f,vh=R.height/f,ox=(v.videoWidth-vw)/2,oy=(v.videoHeight-vh)/2;
  const bx=wide?{x:0,y:0,w:1,h:1}:box,sx=ox+bx.x*vw,sy=oy+bx.y*vh,cw=bx.w*vw,ch=bx.h*vh;
  const psm=wide?'11':'7';if(psm!==curPsm){await worker.setParameters({tessedit_pageseg_mode:psm});curPsm=psm}
  const c=$('#c'),k=c.getContext('2d',{willReadFrequently:true}),sc=Math.min(2,(wide?1600:900)/cw);c.width=cw*sc;c.height=ch*sc;
  k.drawImage(v,sx,sy,cw,ch,0,0,c.width,c.height);
  const im=k.getImageData(0,0,c.width,c.height),d=im.data;let lo=255,hi=0;
  for(let i=0;i<d.length;i+=4){const g=.3*d[i]+.59*d[i+1]+.11*d[i+2];d[i]=d[i+1]=d[i+2]=g;lo=Math.min(lo,g);hi=Math.max(hi,g)}
  const r=Math.max(1,hi-lo);for(let i=0;i<d.length;i+=4){const g=(d[i]-lo)*255/r;d[i]=d[i+1]=d[i+2]=g}
  k.putImageData(im,0,0);
  const {data}=await worker.recognize(c);
  if(wide)return pickWide(data.text);
  const lines=data.text.split('\n').map(clean).filter(Boolean);
  return lines.find(valid)||lines.sort((a,b)=>b.length-a.length)[0]||'';
}
$('#scan').onclick=async()=>{
  if(!stream){$('#st').textContent='Start the camera first.';return}
  $('#st').textContent='Reading…';
  const best=await readFrame();
  if(best===null)return;
  $('#plate').value=best;
  $('#st').textContent=best?(valid(best)?'Check the plate below, then log it.':'Read, but not a UK format. Check it carefully.'):'Nothing read. Move closer or type it in.';
};

// Auto mode: reads about once a second, logs a plate seen in two frames in a row
const COOL=10*60*1000; // Auto mode won't log the same plate again within 10 minutes
let auto=false,last='',seen={},wl,ac;
function beep(){try{const o=ac.createOscillator();o.frequency.value=880;o.connect(ac.destination);o.start();o.stop(ac.currentTime+.25)}catch(e){}}
async function loop(){
  if(!auto)return;
  try{
    const b=await readFrame();
    if(auto&&b&&valid(b)){
      const c=canon(b);
      if(c===last&&!(seen[c]>Date.now()-COOL||load().some(r=>canon(r.p)===c&&Date.now()-r.t<COOL))){seen[c]=Date.now();logPlate(b,true)}
      last=c;
    }else last='';
  }catch(e){}
  if(auto)setTimeout(loop,700);
}
function stopAuto(){auto=false;try{wl&&wl.release()}catch(e){}$('#auto').textContent='Auto: off';$('#auto').classList.remove('go');$('#st').textContent='Auto mode off.'}
$('#auto').onclick=async()=>{
  if(auto){stopAuto();return}
  if(!stream){$('#st').textContent='Start the camera first.';return}
  auto=true;last='';
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  $('#auto').textContent='Auto: on';$('#auto').classList.add('go');
  $('#st').textContent='Auto mode on. Keep this screen open.';
  loop();
};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&auto)stopAuto()});

// Log + match
function check(p){
  const c=canon(p),all=load();
  const same=all.filter(r=>canon(r.p)===c);
  const near=[...new Set(all.filter(r=>canon(r.p)!==c&&lev(canon(r.p),c)===1).map(r=>r.p))];
  return {same,near};
}
function logPlate(p,isAuto){
  const {same,near}=check(p);
  let h='';
  if(same.length){
    const td=day(Date.now()),tN=same.filter(r=>day(r.t)===td),pN=same.filter(r=>day(r.t)!==td),pD=new Set(pN.map(r=>day(r.t))).size;
    const head=[tN.length?'seen '+pl(tN.length,'time')+' earlier today':'',pD?(tN.length?'and ':'seen ')+'on '+pl(pD,'previous day')+' ('+pl(pN.length,'sighting')+')':''].filter(Boolean).join(' ');
    h+=`<div class="msg ${tN.length?'hit':'today'}"><b>${p}: ${head}</b>`+same.slice().reverse().slice(0,6).map(r=>`<div class="mute">${day(r.t)===td?'Today '+fmtT(r.t):fmt(r.t)} · ${where(r)}</div>`).join('')+'</div>';
    if(isAuto)beep();
  }
  else h+=`<div class="msg new"><b>${p}: first sighting</b></div>`;
  if(near.length)h+=`<div class="msg maybe"><b>Possible match</b><div class="mute">Close to ${near.join(', ')}. Could be a misread.</div></div>`;
  if(!valid(p))h+='<div class="msg maybe mute">Not a standard UK format. Logged anyway.</div>';
  $('#res').innerHTML=(isAuto?'<p class="mute">Auto-logged just now</p>':'')+h;
  const rec={p,t:Date.now(),lat:null,lng:null};
  const store=()=>{const a=load();a.push(rec);save(a);if(!isAuto)$('#plate').value='';render()};
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(g=>{rec.lat=g.coords.latitude;rec.lng=g.coords.longitude;store()},store,{enableHighAccuracy:true,timeout:6000,maximumAge:30000});
  else store();
}
$('#log').onclick=()=>{
  const p=clean($('#plate').value);
  if(!p){$('#res').innerHTML='<div class="msg">Enter or scan a plate first.</div>';return}
  logPlate(p,false);
};

// History
let view=0;const VIEWS=['Show: all plates','Show: repeats in one day','Show: seen on 2+ days'];
function render(){
  const g={};load().forEach(r=>(g[canon(r.p)]??=[]).push(r));
  const perDay=k=>g[k].reduce((o,r)=>(o[day(r.t)]=(o[day(r.t)]||0)+1,o),{});
  const nd=k=>Object.keys(perDay(k)).length,mx=k=>Math.max(...Object.values(perDay(k)));
  let keys=Object.keys(g).sort((a,b)=>g[b].at(-1).t-g[a].at(-1).t);
  if(view===1)keys=keys.filter(k=>mx(k)>1);
  if(view===2)keys=keys.filter(k=>nd(k)>1);
  $('#hist').innerHTML=keys.length?keys.map(k=>{
    const rs=g[k],n=nd(k),m=mx(k),byDay={};rs.slice().reverse().forEach(r=>(byDay[day(r.t)]??=[]).push(r));
    return `<details><summary><span>${rs.at(-1).p}</span><span class="mute"><span class="${m>1?'md':''}">${rs.length}×${m>1?' (up to '+m+' in a day)':''}</span> · <span class="${n>1?'bd':''}">${pl(n,'day')}</span> · ${fmt(rs.at(-1).t)}</span></summary>`+
    Object.keys(byDay).map(d=>`<div class="mute dh">${new Date(byDay[d][0].t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} · ${pl(byDay[d].length,'sighting')}</div>`+
      byDay[d].map(r=>`<div class="s"><span>${fmtT(r.t)} · <span class="mute">${where(r)}${r.p!==rs.at(-1).p?' · read as '+r.p:''}</span></span><button data-t="${r.t}" aria-label="Delete sighting">Delete</button></div>`).join('')).join('')+'</details>'
  }).join(''):(view===1?'<p class="mute">No plates seen more than once in a day yet.</p>':view===2?'<p class="mute">No plates seen on more than one day yet.</p>':'<p class="mute">No sightings yet. Scan or type a plate and tap Log sighting.</p>');
}
$('#multi').onclick=()=>{view=(view+1)%3;$('#multi').textContent=VIEWS[view];render()};
$('#hist').onclick=e=>{const t=e.target.dataset.t;if(t){save(load().filter(r=>String(r.t)!==t));render()}};
$('#wipe').onclick=()=>{if(confirm('Delete every logged sighting on this device?')){save([]);render();$('#res').innerHTML=''}};
$('#ret').value=String(days);
$('#ret').onchange=e=>{days=+e.target.value;localStorage.setItem(SET,days);purge();render()};

purge();render();paintMode();initReader();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
